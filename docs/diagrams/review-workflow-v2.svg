<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" font-family="Inter, 'Segoe UI', Arial, sans-serif">
<title>Quorum review: advice, human decisions and explicit outcomes</title>
<desc>Separate service reaction chains, advisory Triage, and PanelDecision with award, direct decline, and acknowledged decline after budget refusal. Dotted arrows are proposed routes, not stated model relationships.</desc>
<defs>
<marker id="arrow" orient="auto" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5"><path d="M 0 0 L 9 5 L 0 10 Z" fill="#142341"/></marker>
<marker id="light" orient="auto" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5"><path d="M 0 0 L 9 5 L 0 10 Z" fill="#8B9EB8"/></marker>
</defs>
<rect x="0" y="0" width="1536" height="1024" fill="#FFFFFF"/>
<text x="18" y="46" font-size="39" font-weight="750" fill="#0B1330">Quorum review: advice, human decisions and explicit outcomes</text>
<text x="18" y="85" font-size="27" fill="#4C5C78">Triage and PanelDecision internals with the service reactions that advance review</text>

<g class="domain" data-label="Service reactions" data-grade="declared">
<rect x="16" y="114" width="700" height="750" rx="12" fill="#F7FAFD" stroke="#B4CFE9"/>
<text x="30" y="150" font-size="27" font-weight="700" fill="#101B3D">Service reactions</text>
<text x="30" y="177" font-size="17" fill="#4A6081">Separate command/event chains, not one orchestrated sequence</text>
<g class="service" data-label="ProposalSubmitted" data-grade="declared">
<rect x="32" y="215" width="180" height="60" rx="6" fill="#D5E9FF" stroke="#2684F7"/>
<text x="46" y="250" font-family="monospace" font-size="15" font-weight="700" fill="#12365D">ProposalSubmitted</text>
</g>
<g class="service" data-label="ProposalEnteredScreening" data-grade="declared">
<rect x="450" y="215" width="248" height="60" rx="6" fill="#D3EFF0" stroke="#0099A4"/>
<text x="463" y="250" font-family="monospace" font-size="15" font-weight="700" fill="#123E53">ProposalEnteredScreening</text>
</g>
<g class="service" data-label="ConfirmEligibility" data-grade="declared">
<rect x="32" y="350" width="218" height="78" rx="6" fill="#D5E9FF" stroke="#2684F7" stroke-width="1.5"/>
<text x="46" y="380" font-family="monospace" font-size="16" font-weight="700" fill="#12365D">ConfirmEligibility</text>
<text x="46" y="406" font-size="15" fill="#12365D"><tspan>Officer confirms eligibility</tspan></text>
</g>
<g class="service" data-label="ProposalEligible" data-grade="declared">
<rect x="496" y="320" width="202" height="58" rx="6" fill="#D3EFF0" stroke="#0099A4"/>
<text x="510" y="354" font-family="monospace" font-size="16" font-weight="700" fill="#123E53">ProposalEligible</text>
</g>
<g class="service" data-label="ProposalIneligible" data-grade="declared">
<rect x="496" y="420" width="202" height="58" rx="6" fill="#D3EFF0" stroke="#0099A4"/>
<text x="510" y="454" font-family="monospace" font-size="16" font-weight="700" fill="#123E53">ProposalIneligible</text>
</g>
<g class="service" data-label="AssignReviewer" data-grade="declared">
<rect x="32" y="535" width="158" height="60" rx="6" fill="#D5E9FF" stroke="#2684F7"/>
<text x="45" y="570" font-family="monospace" font-size="15" font-weight="700" fill="#12365D">AssignReviewer</text>
</g>
<g class="service" data-label="ReviewersAssigned" data-grade="declared">
<rect x="288" y="535" width="181" height="60" rx="6" fill="#D3EFF0" stroke="#0099A4"/>
<text x="301" y="570" font-family="monospace" font-size="15" font-weight="700" fill="#123E53">ReviewersAssigned</text>
</g>
<g class="service" data-label="ProposalUnderReview" data-grade="declared">
<rect x="518" y="535" width="184" height="60" rx="6" fill="#D3EFF0" stroke="#0099A4"/>
<text x="531" y="570" font-family="monospace" font-size="14" font-weight="700" fill="#123E53">ProposalUnderReview</text>
</g>
<g class="service" data-label="SubmitReview" data-grade="declared">
<rect x="32" y="665" width="150" height="60" rx="6" fill="#D5E9FF" stroke="#2684F7"/>
<text x="46" y="700" font-family="monospace" font-size="16" font-weight="700" fill="#12365D">SubmitReview</text>
</g>
<g class="service" data-label="ReviewSubmitted" data-grade="declared">
<rect x="281" y="665" width="174" height="60" rx="6" fill="#D3EFF0" stroke="#0099A4"/>
<text x="294" y="700" font-family="monospace" font-size="15" font-weight="700" fill="#123E53">ReviewSubmitted</text>
</g>
<g class="service" data-label="ProposalFullyReviewed" data-grade="declared">
<rect x="499" y="665" width="203" height="60" rx="6" fill="#D3EFF0" stroke="#0099A4"/>
<text x="512" y="700" font-family="monospace" font-size="14" font-weight="700" fill="#123E53">ProposalFullyReviewed</text>
</g>
<g class="service" data-label="ProposalScored" data-grade="declared">
<rect x="499" y="787" width="203" height="58" rx="6" fill="#C5ECEC" stroke="#0099A4" stroke-width="1.5"/>
<text x="522" y="822" font-family="monospace" font-size="18" font-weight="700" fill="#123E53">ProposalScored</text>
</g>
</g>

<g class="domain" data-label="Triage" data-grade="declared">
<rect x="732" y="114" width="240" height="456" rx="12" fill="#F7FAFD" stroke="#B4CFE9"/>
<text x="748" y="150" font-size="27" font-weight="700" fill="#101B3D">Triage</text>
<text x="748" y="174" font-size="14" fill="#4A6081"><tspan x="748">Advisory and non-blocking;</tspan><tspan x="748" dy="18">agent failure records absent advice</tspan></text>
<g class="service" data-label="assess" data-grade="declared">
<rect x="751" y="220" width="202" height="70" rx="6" fill="#D5E9FF" stroke="#2684F7"/>
<text x="852" y="247" text-anchor="middle" font-family="monospace" font-size="19" font-weight="700" fill="#102D53">assess</text>
<text x="852" y="273" text-anchor="middle" font-size="16" fill="#102D53"><tspan>EligibilityTriage</tspan></text>
</g>
<g class="service" data-label="record" data-grade="declared">
<rect x="751" y="350" width="202" height="70" rx="6" fill="#D5E9FF" stroke="#2684F7"/>
<text x="852" y="378" text-anchor="middle" font-family="monospace" font-size="19" font-weight="700" fill="#102D53">record</text>
<text x="852" y="403" text-anchor="middle" font-size="16" fill="#102D53"><tspan>RecordTriageProposal</tspan></text>
</g>
<g class="service" data-label="proposed" data-grade="declared">
<rect x="751" y="480" width="202" height="70" rx="6" fill="#D3EFF0" stroke="#0099A4"/>
<text x="852" y="507" text-anchor="middle" font-family="monospace" font-size="19" font-weight="700" fill="#123E53">proposed</text>
<text x="852" y="533" text-anchor="middle" font-size="15" fill="#123E53"><tspan>Publishes TriageProposed</tspan></text>
</g>
</g>

<g class="domain" data-label="PanelDecision" data-grade="declared">
<rect x="988" y="114" width="532" height="850" rx="12" fill="#F7FAFD" stroke="#B4CFE9"/>
<text x="1002" y="150" font-size="27" font-weight="700" fill="#101B3D">PanelDecision</text>
<text x="1002" y="176" font-size="16" fill="#4A6081">Chair decides; budget refusal requires acknowledged decline</text>
<g class="service" data-label="decide" data-grade="declared">
<rect x="1008" y="202" width="250" height="126" rx="7" fill="#E9D9FA" stroke="#7534BA" stroke-width="1.5"/>
<text x="1022" y="228" font-family="monospace" font-size="20" font-weight="700" fill="#281548">decide</text>
<text x="1022" y="250" font-size="16" fill="#281548"><tspan>PanelChair</tspan></text>
<text x="1022" y="276" font-size="14" fill="#493366"><tspan x="1022">After 14 days: notify officer;</tspan><tspan x="1022" dy="18">task stays open, no timeout decision</tspan></text>
</g>
<g class="service" data-label="isAward" data-grade="declared">
<rect x="1300" y="222" width="196" height="80" rx="20" fill="#E6EDF9" stroke="#6A87B6" stroke-width="1.5"/>
<text x="1398" y="251" text-anchor="middle" font-family="monospace" font-size="20" font-weight="700" fill="#172D53">isAward</text>
<text x="1398" y="278" text-anchor="middle" font-size="16" fill="#172D53"><tspan>Verdict is award?</tspan></text>
</g>
<g class="service" data-label="commit" data-grade="declared">
<rect x="1300" y="355" width="196" height="65" rx="6" fill="#D5E9FF" stroke="#2684F7"/>
<text x="1398" y="382" text-anchor="middle" font-family="monospace" font-size="19" font-weight="700" fill="#12365D">commit</text>
<text x="1398" y="406" text-anchor="middle" font-size="16" fill="#12365D"><tspan>CommitAward</tspan></text>
</g>
<g class="service" data-label="committed" data-grade="declared">
<rect x="1300" y="455" width="196" height="75" rx="20" fill="#E6EDF9" stroke="#6A87B6" stroke-width="1.5"/>
<text x="1398" y="484" text-anchor="middle" font-family="monospace" font-size="19" font-weight="700" fill="#172D53">committed</text>
<text x="1398" y="510" text-anchor="middle" font-size="16" fill="#172D53"><tspan>Within envelope?</tspan></text>
</g>
<g class="service" data-label="awarded" data-grade="declared">
<rect x="1290" y="590" width="214" height="68" rx="6" fill="#C5ECEC" stroke="#0099A4" stroke-width="1.5"/>
<text x="1397" y="617" text-anchor="middle" font-family="monospace" font-size="20" font-weight="700" fill="#123E53">awarded</text>
<text x="1397" y="642" text-anchor="middle" font-size="15" fill="#123E53"><tspan>Publishes ProposalAwarded</tspan></text>
</g>
<g class="service" data-label="decline" data-grade="declared">
<rect x="1008" y="365" width="206" height="65" rx="6" fill="#D5E9FF" stroke="#2684F7"/>
<text x="1111" y="392" text-anchor="middle" font-family="monospace" font-size="19" font-weight="700" fill="#12365D">decline</text>
<text x="1111" y="416" text-anchor="middle" font-size="16" fill="#12365D"><tspan>RecordDecline</tspan></text>
</g>
<g class="service" data-label="declined" data-grade="declared">
<rect x="1008" y="473" width="230" height="68" rx="6" fill="#C5ECEC" stroke="#0099A4" stroke-width="1.5"/>
<text x="1123" y="500" text-anchor="middle" font-family="monospace" font-size="20" font-weight="700" fill="#123E53">declined</text>
<text x="1123" y="525" text-anchor="middle" font-size="15" fill="#123E53"><tspan>Publishes ProposalDeclined</tspan></text>
</g>
<g class="service" data-label="refused" data-grade="declared">
<rect x="1048" y="590" width="218" height="68" rx="6" fill="#FFE6B8" stroke="#D18A16"/>
<text x="1157" y="617" text-anchor="middle" font-family="monospace" font-size="20" font-weight="700" fill="#65400D">refused</text>
<text x="1157" y="642" text-anchor="middle" font-size="16" fill="#65400D"><tspan>Publishes AwardRefused</tspan></text>
</g>
<g class="service" data-label="reconsider" data-grade="declared">
<rect x="1048" y="699" width="448" height="120" rx="7" fill="#E9D9FA" stroke="#7534BA" stroke-width="1.5"/>
<text x="1063" y="726" font-family="monospace" font-size="20" font-weight="700" fill="#281548">reconsider</text>
<text x="1063" y="750" font-size="16" fill="#281548"><tspan>PanelChair acknowledges decline</tspan></text>
<text x="1063" y="778" font-size="15" fill="#493366"><tspan x="1063">Only acknowledged decline; stays open and escalates</tspan><tspan x="1063" dy="20">to officer until recorded</tspan></text>
</g>
<g class="service" data-label="declineRefused" data-grade="declared">
<rect x="1048" y="867" width="190" height="68" rx="6" fill="#D5E9FF" stroke="#2684F7"/>
<text x="1143" y="894" text-anchor="middle" font-family="monospace" font-size="18" font-weight="700" fill="#12365D">declineRefused</text>
<text x="1143" y="919" text-anchor="middle" font-size="16" fill="#12365D"><tspan>RecordDecline</tspan></text>
</g>
<g class="service" data-label="declinedRefused" data-grade="declared">
<rect x="1274" y="867" width="230" height="68" rx="6" fill="#C5ECEC" stroke="#0099A4" stroke-width="1.5"/>
<text x="1389" y="894" text-anchor="middle" font-family="monospace" font-size="19" font-weight="700" fill="#123E53">declinedRefused</text>
<text x="1389" y="919" text-anchor="middle" font-size="15" fill="#123E53"><tspan>Publishes ProposalDeclined</tspan></text>
</g>
</g>

<g fill="none" stroke="#142341" stroke-width="2" stroke-linejoin="round">
<g class="edge" data-from="ProposalSubmitted" data-to="Triage"><path d="M 122 215 L 122 199 L 723 199 L 723 255 L 732 255" marker-end="url(#arrow)"/><text x="660" y="192" fill="#142341" stroke="#FFFFFF" stroke-width="6" paint-order="stroke" font-size="14">triggers</text></g>
<g class="edge" data-from="ProposalScored" data-to="PanelDecision"><path d="M 702 816 L 980 816 L 980 840 L 988 840" marker-end="url(#arrow)"/><text x="814" y="805" fill="#142341" stroke="#FFFFFF" stroke-width="6" paint-order="stroke" font-size="15">triggers</text></g>
<g class="edge" data-from="assess" data-to="record"><path d="M 852 290 L 852 350" marker-end="url(#arrow)"/></g>
<g class="edge" data-from="record" data-to="proposed"><path d="M 852 420 L 852 480" marker-end="url(#arrow)"/></g>
<g class="edge" data-from="decide" data-to="isAward"><path d="M 1258 262 L 1300 262" marker-end="url(#arrow)"/></g>
<g class="edge" data-from="isAward" data-to="commit"><path d="M 1398 302 L 1398 355" marker-end="url(#arrow)"/><text x="1410" y="333" fill="#142341" stroke="#FFFFFF" stroke-width="6" paint-order="stroke" font-size="14">if result</text></g>
<g class="edge" data-from="isAward" data-to="decline"><path d="M 1320 302 L 1320 342 L 1111 342 L 1111 365" marker-end="url(#arrow)"/><text x="1180" y="337" fill="#142341" stroke="#FFFFFF" stroke-width="6" paint-order="stroke" font-size="14">default</text></g>
<g class="edge" data-from="commit" data-to="committed"><path d="M 1398 420 L 1398 455" marker-end="url(#arrow)"/></g>
<g class="edge" data-from="committed" data-to="awarded"><path d="M 1397 530 L 1397 590" marker-end="url(#arrow)"/><text x="1410" y="565" fill="#142341" stroke="#FFFFFF" stroke-width="6" paint-order="stroke" font-size="14">if result</text></g>
<g class="edge" data-from="committed" data-to="refused"><path d="M 1300 492 L 1260 492 L 1260 562 L 1157 562 L 1157 590" marker-end="url(#arrow)"/><text x="1190" y="557" fill="#142341" stroke="#FFFFFF" stroke-width="6" paint-order="stroke" font-size="14">default</text></g>
<g class="edge" data-from="refused" data-to="reconsider"><path d="M 1157 658 L 1157 699" marker-end="url(#arrow)"/></g>
<g class="edge" data-from="reconsider" data-to="declineRefused"><path d="M 1143 819 L 1143 867" marker-end="url(#arrow)"/></g>
<g class="edge" data-from="declineRefused" data-to="declinedRefused"><path d="M 1238 901 L 1274 901" marker-end="url(#arrow)"/></g>
<g class="edge" data-from="decline" data-to="declined"><path d="M 1111 430 L 1111 473" marker-end="url(#arrow)"/></g>
</g>

<g fill="none" stroke="#8B9EB8" stroke-width="1.5" stroke-linecap="round">
<g class="edge" data-kind="derived" data-grade="speculative" data-from="ProposalSubmitted" data-to="ProposalEnteredScreening"><path d="M 212 245 L 450 245" stroke-dasharray="2 4" marker-end="url(#light)"/><text x="277" y="234" font-size="14" fill="#405A7A" stroke="#FFFFFF" stroke-width="6" paint-order="stroke">ProposalService</text></g>
<g class="edge" data-kind="derived" data-grade="speculative" data-from="ConfirmEligibility" data-to="ProposalEligible"><path d="M 250 371 L 496 349" stroke-dasharray="2 4" marker-end="url(#light)"/><text x="278" y="341" font-size="14" fill="#405A7A" stroke="#FFFFFF" stroke-width="6" paint-order="stroke">ProposalService · one of</text></g>
<g class="edge" data-kind="derived" data-grade="speculative" data-from="ConfirmEligibility" data-to="ProposalIneligible"><path d="M 250 408 L 496 449" stroke-dasharray="2 4" marker-end="url(#light)"/><text x="278" y="435" font-size="14" fill="#405A7A" stroke="#FFFFFF" stroke-width="6" paint-order="stroke">ProposalService · one of</text></g>
<g class="edge" data-kind="derived" data-grade="speculative" data-from="AssignReviewer" data-to="ReviewersAssigned"><path d="M 190 565 L 288 565" stroke-dasharray="2 4" marker-end="url(#light)"/><text x="185" y="521" font-size="14" fill="#405A7A" stroke="#FFFFFF" stroke-width="6" paint-order="stroke">AssignmentService</text></g>
<g class="edge" data-kind="derived" data-grade="speculative" data-from="ReviewersAssigned" data-to="ProposalUnderReview"><path d="M 469 565 L 518 565" stroke-dasharray="2 4" marker-end="url(#light)"/><text x="455" y="521" font-size="14" fill="#405A7A" stroke="#FFFFFF" stroke-width="6" paint-order="stroke">ProposalService</text></g>
<g class="edge" data-kind="derived" data-grade="speculative" data-from="SubmitReview" data-to="ReviewSubmitted"><path d="M 182 695 L 281 695" stroke-dasharray="2 4" marker-end="url(#light)"/><text x="170" y="655" font-size="14" fill="#405A7A" stroke="#FFFFFF" stroke-width="6" paint-order="stroke">AssignmentService</text></g>
<g class="edge" data-kind="derived" data-grade="speculative" data-from="ReviewSubmitted" data-to="ProposalFullyReviewed"><path d="M 455 695 L 499 695" stroke-dasharray="2 4" marker-end="url(#light)"/><text x="362" y="617" font-size="13" fill="#405A7A" stroke="#FFFFFF" stroke-width="6" paint-order="stroke"><tspan x="362">ReviewCompletion · once at three submitted</tspan><tspan x="362" dy="17">reviews on non-revoked assignments</tspan></text></g>
<g class="edge" data-kind="derived" data-grade="speculative" data-from="ProposalFullyReviewed" data-to="ProposalScored"><path d="M 600 725 L 600 787" stroke-dasharray="2 4" marker-end="url(#light)"/><text x="464" y="761" font-size="14" fill="#405A7A" stroke="#FFFFFF" stroke-width="6" paint-order="stroke">ProposalService</text></g>
</g>

<g class="legend" data-label="Arrows">
<text x="31" y="912" font-size="19" font-weight="700" fill="#101B3D">Arrows</text>
<path d="M 32 939 L 103 939" stroke="#142341" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
<text x="121" y="944" font-size="15" fill="#203553">Solid: stated in the model</text>
<path d="M 32 973 L 103 973" stroke="#8B9EB8" stroke-width="1.5" stroke-dasharray="2 4" marker-end="url(#light)" fill="none"/>
<text x="121" y="978" font-size="15" fill="#203553">Dotted: proposed, not in the model</text>
</g>
</svg>
